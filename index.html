<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>集团·智理通 V4.0</title>
    <style>
      #app-loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);z-index:99999;transition:opacity .4s}
      #app-loading.hide{opacity:0;pointer-events:none}
      #app-loading .logo{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,#1a365d,#2a4a7f);display:flex;align-items:center;justify-content:center;margin-bottom:24px;box-shadow:0 4px 20px rgba(26,54,93,.5)}
      #app-loading .logo svg{width:28px;height:28px}
      #app-loading .title{color:#f1f5f9;font-size:22px;font-weight:700;letter-spacing:1px;margin-bottom:6px}
      #app-loading .sub{color:#64748b;font-size:13px;margin-bottom:32px}
      #app-loading .bar{width:180px;height:3px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}
      #app-loading .bar-inner{width:0;height:100%;background:linear-gradient(90deg,#60a5fa,#a78bfa);border-radius:2px;animation:loadbar 1.8s ease-in-out infinite}
      @keyframes loadbar{0%{width:0;margin-left:0}50%{width:60%}100%{width:0;margin-left:100%}}
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-loading">
        <div class="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        </div>
        <div class="title">集团·智理通</div>
        <div class="sub">效能军团 · V4.0</div>
        <div class="bar"><div class="bar-inner"></div></div>
      </div>
    </div>
    <script>
      (function(){var r=sessionStorage.redirect;delete sessionStorage.redirect;if(r&&r!=='/zhi-li-tong-v4/'){history.replaceState(null,null,r)}});
      window.addEventListener('load',function(){var e=document.getElementById('app-loading');if(e){e.classList.add('hide');setTimeout(function(){e.remove()},500)}});
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
